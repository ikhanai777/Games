<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>PULSEGON</title>
  <meta name="description" content="A beat-locked, two-button survival game. Every wall is a note.">
  <meta name="theme-color" content="#07060a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="PULSEGON arena" hidden></canvas>
    <canvas id="game3d" aria-label="PULSEGON arena in 3D"></canvas>
  </div>
  <div id="hud" aria-live="polite"></div>
  <div id="overlay"></div>
  <noscript><p class="noscript">PULSEGON needs JavaScript.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
